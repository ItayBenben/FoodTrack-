[project]
name = "foodtrack-analysis"
version = "1.0.0"
description = "FoodTrack association and trial engine (docs/04-analysis-engine.md)"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
markers = ["gate: the statistical release gate (null-data test)", "slow: long-running"]
testpaths = ["tests"]
