<title>FoodTrack Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Heebo:wght@400;500;600;700&display=swap">
<style>
/* ══ app tokens — lifted verbatim from 05-ux-design.md §2.1 ══ */
:root{
  --bg:#FBFAF8; --surface:#FFFFFF; --sunken:#F2F0EC; --border:#E4E0D9;
  --text:#1C1A17; --muted:#6B6560; --faint:#9A938C;
  --accent:#3F6E5E; --accent-soft:#E6EFEA; --accent-ink:#2C5245;
  --warn:#B4762A; --warn-soft:#F7EEDF; --danger:#A4383A; --danger-soft:#F7E7E7;
  --info:#3A5B7A; --info-soft:#E5EDF4;
  --dry:#C08A3E; --wet:#4A7EA5;      /* Bristol diverging scale, anchored at 4 */
  --shadow:0 1px 2px rgba(28,26,23,.05), 0 10px 30px -18px rgba(28,26,23,.35);
  --stage:#EDEBE5; --stage-ink:#1C1A17; --stage-muted:#6B6560; --stage-line:#DAD6CD;
  --fs:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --fh:"Heebo","Inter",-apple-system,sans-serif;
  --r-sm:8px; --r-md:16px; --r-lg:28px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14130F; --surface:#1E1C18; --sunken:#100F0C; --border:#33302A;
    --text:#F2EFE9; --muted:#9C958C; --faint:#77716A;
    --accent:#6FA891; --accent-soft:#22332C; --accent-ink:#8FC2AC;
    --warn:#D69E52; --warn-soft:#2E2718; --danger:#D96B6D; --danger-soft:#301F1F;
    --info:#7BA3C9; --info-soft:#1B2530;
    --dry:#D6A25A; --wet:#7BA9CD;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.8);
    --stage:#0C0B08; --stage-ink:#F2EFE9; --stage-muted:#9C958C; --stage-line:#2A2822;
  }
}
:root[data-theme="dark"]{
  --bg:#14130F; --surface:#1E1C18; --sunken:#100F0C; --border:#33302A;
  --text:#F2EFE9; --muted:#9C958C; --faint:#77716A;
  --accent:#6FA891; --accent-soft:#22332C; --accent-ink:#8FC2AC;
  --warn:#D69E52; --warn-soft:#2E2718; --danger:#D96B6D; --danger-soft:#301F1F;
  --info:#7BA3C9; --info-soft:#1B2530;
  --dry:#D6A25A; --wet:#7BA9CD;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.8);
  --stage:#0C0B08; --stage-ink:#F2EFE9; --stage-muted:#9C958C; --stage-line:#2A2822;
}
/* app-local theme override, driven by the prototype's own ◐ button */
#app[data-app="light"]{
  --bg:#FBFAF8; --surface:#FFFFFF; --sunken:#F2F0EC; --border:#E4E0D9;
  --text:#1C1A17; --muted:#6B6560; --faint:#9A938C;
  --accent:#3F6E5E; --accent-soft:#E6EFEA; --accent-ink:#2C5245;
  --warn:#B4762A; --warn-soft:#F7EEDF; --danger:#A4383A; --danger-soft:#F7E7E7;
  --info:#3A5B7A; --info-soft:#E5EDF4; --dry:#C08A3E; --wet:#4A7EA5;
  --shadow:0 1px 2px rgba(28,26,23,.05), 0 10px 30px -18px rgba(28,26,23,.35);
}
#app[data-app="dark"]{
  --bg:#14130F; --surface:#1E1C18; --sunken:#100F0C; --border:#33302A;
  --text:#F2EFE9; --muted:#9C958C; --faint:#77716A;
  --accent:#6FA891; --accent-soft:#22332C; --accent-ink:#8FC2AC;
  --warn:#D69E52; --warn-soft:#2E2718; --danger:#D96B6D; --danger-soft:#301F1F;
  --info:#7BA3C9; --info-soft:#1B2530; --dry:#D6A25A; --wet:#7BA9CD;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.8);
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; background:var(--stage); color:var(--stage-ink);
  font-family:var(--fs); overflow:hidden; -webkit-font-smoothing:antialiased;
}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer; padding:0}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}

/* ══ stage (desktop) ══ */
.stage{display:flex; height:100dvh; align-items:stretch}
.side{
  flex:0 0 268px; border-inline-end:1px solid var(--stage-line);
  padding:26px 20px; overflow-y:auto; background:var(--stage);
}
.brandmark{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); font-weight:600}
.brandname{font-size:24px; font-weight:700; letter-spacing:-.025em; margin:6px 0 4px}
.brandnote{font-size:12.5px; color:var(--stage-muted); line-height:1.5; margin:0 0 22px}
.grp{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--stage-muted);
  font-weight:600; margin:20px 0 7px}
.slink{
  display:flex; align-items:center; gap:9px; width:100%; text-align:start;
  padding:8px 10px; border-radius:8px; font-size:13.5px; color:var(--stage-ink);
}
.slink:hover{background:rgba(127,127,127,.1)}
.slink.on{background:var(--accent); color:#fff; font-weight:500}
.slink .n{font-size:10.5px; opacity:.6; font-variant-numeric:tabular-nums; min-width:14px}
.sfoot{margin-top:26px; padding-top:18px; border-top:1px solid var(--stage-line);
  font-size:11.5px; color:var(--stage-muted); line-height:1.6}

.field{flex:1 1 auto; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:16px; padding:24px; min-width:0}
.fieldbar{display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center}
.tgl{
  display:inline-flex; align-items:center; gap:6px; border:1px solid var(--stage-line);
  border-radius:999px; padding:6px 13px; font-size:12.5px; color:var(--stage-muted);
  background:var(--stage);
}
.tgl:hover{border-color:var(--accent); color:var(--accent)}
.tgl b{font-weight:600; color:var(--stage-ink)}
.caption{font-size:12px; color:var(--stage-muted); text-align:center; max-width:390px; line-height:1.5}

/* ══ device ══ */
.device{
  width:390px; height:844px; max-height:calc(100dvh - 130px); flex:0 0 auto;
  border-radius:42px; padding:11px; background:#26241F;
  box-shadow:0 2px 4px rgba(0,0,0,.2), 0 30px 70px -30px rgba(0,0,0,.55);
}
:root[data-theme="dark"] .device, :root:not([data-theme="light"]) .device{background:#2E2B25}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .device{background:#26241F}}
#app{
  width:100%; height:100%; border-radius:32px; overflow:hidden; position:relative;
  background:var(--bg); color:var(--text); display:flex; flex-direction:column;
  font-size:16px; line-height:1.5;
}
#app[dir="rtl"]{font-family:var(--fh)}

/* ══ mobile: prototype fills the viewport ══ */
.mobar{display:none}
@media (max-width:820px){
  .side{display:none}
  .stage{height:calc(100dvh - 46px)}
  .field{padding:0; gap:0; height:100%; justify-content:flex-start}
  .caption{display:none}
  .fieldbar{display:none}
  .device{width:100%; height:100%; max-height:none; border-radius:0; padding:0; box-shadow:none}
  #app{border-radius:0}
  .mobar{
    display:flex; align-items:center; gap:8px; height:46px; flex:0 0 46px; width:100%;
    padding:0 12px; border-top:1px solid var(--stage-line); background:var(--stage);
  }
  .mobar .mname{flex:1 1 auto; font-size:13px; font-weight:600; letter-spacing:-.01em;
    text-align:start; display:flex; align-items:center; gap:7px; min-width:0}
  .mobar .mname span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .mobar .mname::after{content:"▾"; font-size:10px; color:var(--stage-muted)}
  .mbtn{border:1px solid var(--stage-line); border-radius:999px; padding:5px 11px;
    font-size:12px; color:var(--stage-muted); flex:0 0 auto}
  .picker{
    position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.45);
    display:none; align-items:flex-end;
  }
  .picker.open{display:flex}
  .picker-in{width:100%; background:var(--stage); border-radius:20px 20px 0 0;
    padding:14px 14px calc(14px + env(safe-area-inset-bottom)); max-height:76dvh; overflow-y:auto}
}
@media (min-width:821px){ .picker{display:none !important} }
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}
</style>
<style>
/* ══════════ in-app design system ══════════ */
#app .scroll{flex:1 1 auto; overflow-y:auto; overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch; padding:0 16px 108px}
#app .pad{padding-top:14px}

/* top bar */
#app .abar{
  flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:14px 16px 8px;
  background:var(--bg); position:relative; z-index:2;
}
#app .abar h1{font-size:19px; font-weight:600; letter-spacing:-.02em; margin:0; flex:1 1 auto}
#app .abar .back{font-size:20px; line-height:1; color:var(--muted); padding:4px 6px; margin-inline-start:-6px}
#app [dir="rtl"] .back, #app[dir="rtl"] .back{transform:scaleX(-1)}
#app .sync{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--faint)}
#app .sync i{width:6px; height:6px; border-radius:50%; background:var(--accent); display:block}

/* generic */
#app .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md);
  box-shadow:var(--shadow); padding:14px 15px; margin-bottom:12px}
#app .lbl{font-size:11px; font-weight:600; letter-spacing:.11em; text-transform:uppercase;
  color:var(--faint); margin:20px 0 9px}
#app .muted{color:var(--muted)}
#app .tiny{font-size:12.5px; line-height:1.5}
#app .num{font-variant-numeric:tabular-nums}
#app .row{display:flex; align-items:center; gap:10px}
#app .sp{flex:1 1 auto}

#app .btn{
  display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
  min-height:50px; border-radius:var(--r-sm); background:var(--accent); color:#fff;
  font-size:16px; font-weight:600; letter-spacing:-.01em;
}
#app[data-app="dark"] .btn, :root[data-theme="dark"] #app .btn{color:#0F1512}
#app .btn.ghost{background:transparent; color:var(--muted); border:1px solid var(--border); font-weight:500}
#app .btn.soft{background:var(--accent-soft); color:var(--accent-ink); font-weight:600}
#app .btn.sm{min-height:42px; font-size:14px}
#app .btnrow{display:flex; gap:9px}
#app .btnrow .btn{flex:1 1 0}

#app .chip{
  display:inline-flex; align-items:center; gap:5px; border:1px solid var(--border);
  border-radius:999px; padding:5px 11px; font-size:12.5px; color:var(--muted);
  background:var(--surface);
}
#app .chip.on{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}

/* score card */
#app .score{display:flex; align-items:flex-end; gap:12px}
#app .score .v{font-size:34px; font-weight:700; letter-spacing:-.035em; line-height:1;
  font-variant-numeric:tabular-nums}
#app .score .d{font-size:13px; color:var(--muted); padding-bottom:4px}
#app .spark{height:30px; width:100%; margin-top:10px; display:block}

/* quick log grid */
#app .qgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:9px}
#app .qtile{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md);
  padding:12px 4px 10px; display:flex; flex-direction:column; align-items:center; gap:6px;
  box-shadow:var(--shadow); min-height:76px; justify-content:center;
}
#app .qtile:active{background:var(--sunken)}
#app .qtile .ic{width:26px; height:26px; color:var(--accent)}
#app .qtile .t{font-size:11.5px; font-weight:500; letter-spacing:-.01em}

/* usual tiles */
#app .usual{display:grid; grid-template-columns:1fr 1fr; gap:9px}
#app .utile{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md);
  padding:12px 13px; text-align:start; box-shadow:var(--shadow);
}
#app .utile .t{font-size:14px; font-weight:500; letter-spacing:-.01em; line-height:1.3}
#app .utile .s{font-size:11.5px; color:var(--faint); margin-top:4px}

/* event rows */
#app .ev{display:flex; gap:11px; align-items:flex-start; padding:9px 2px;
  border-bottom:1px solid var(--border)}
#app .ev:last-child{border-bottom:none}
#app .ev .tm{font-size:12.5px; color:var(--faint); font-variant-numeric:tabular-nums;
  flex:0 0 40px; padding-top:2px}
#app .ev .ic{flex:0 0 20px; width:20px; height:20px; color:var(--muted); margin-top:1px}
#app .ev .bd{flex:1 1 auto; min-width:0}
#app .ev .bd .t{font-size:14.5px; line-height:1.4}
#app .ev .bd .s{display:block; font-size:12px; color:var(--faint); margin-top:2px}
#app .ev .more{color:var(--faint); font-size:16px; padding:0 4px}

/* trial strip */
#app .phase{display:flex; gap:3px; margin:9px 0 6px; align-items:center}
#app .pdot{width:9px; height:9px; border-radius:50%; background:var(--border); flex:0 0 auto}
#app .pdot.done{background:var(--accent)}
#app .psep{width:1px; height:12px; background:var(--border); margin:0 4px; flex:0 0 auto}

/* fab */
#app .fab{
  position:absolute; inset-inline-end:18px; bottom:calc(66px + 16px); width:58px; height:58px;
  border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center;
  justify-content:center; box-shadow:0 6px 20px -6px rgba(0,0,0,.45); z-index:4; font-size:28px;
  font-weight:300; line-height:1;
}
#app[data-app="dark"] .fab, :root[data-theme="dark"] #app .fab{color:#0F1512}

/* tab bar */
#app .tabs{
  flex:0 0 auto; display:flex; border-top:1px solid var(--border); background:var(--surface);
  padding-bottom:env(safe-area-inset-bottom); z-index:5;
}
#app .tab{flex:1 1 0; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:9px 0 10px; color:var(--faint); font-size:10.5px; font-weight:500}
#app .tab.on{color:var(--accent)}
#app .tab svg{width:22px; height:22px}

/* sheets */
#app .veil{position:absolute; inset:0; background:rgba(0,0,0,.4); z-index:8; display:none}
#app .veil.open{display:block}
#app .sheet{
  position:absolute; inset-inline:0; bottom:0; z-index:9; background:var(--bg);
  border-radius:var(--r-lg) var(--r-lg) 0 0; max-height:94%; display:none;
  flex-direction:column; box-shadow:0 -8px 30px -12px rgba(0,0,0,.4);
}
#app .sheet.open{display:flex}
#app .sheet .sh{display:flex; align-items:center; gap:10px; padding:16px 16px 10px}
#app .sheet .sh h2{font-size:17px; font-weight:600; margin:0; flex:1 1 auto; letter-spacing:-.015em}
#app .sheet .sh .x{color:var(--muted); font-size:19px; padding:2px 6px}
#app .sheet .sb{overflow-y:auto; padding:0 16px 20px; -webkit-overflow-scrolling:touch}
#app .grab{width:38px; height:4px; border-radius:2px; background:var(--border);
  margin:8px auto 0; flex:0 0 auto}

/* bristol grid */
#app .bgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
#app .btile{
  border:1px solid var(--border); border-radius:var(--r-md); background:var(--surface);
  padding:9px 3px 8px; display:flex; flex-direction:column; align-items:center; gap:5px;
}
#app .btile svg{width:42px; height:26px}
#app .btile .n{font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1}
#app .btile .w{font-size:9.5px; color:var(--faint); text-align:center; line-height:1.25;
  padding:0 2px; letter-spacing:-.01em}
#app .btile.sel{border-color:var(--accent); background:var(--accent-soft); border-width:2px; padding:8px 2px 7px}
#app .btile[data-tone="dry"] svg{color:var(--dry)}
#app .btile[data-tone="mid"] svg{color:var(--accent)}
#app .btile[data-tone="wet"] svg{color:var(--wet)}
#app .norm{font-size:11.5px; color:var(--faint); text-align:center; margin:10px 0 0}

/* saved strip */
#app .saved{
  display:flex; align-items:center; gap:8px; margin:14px 0 10px; padding:10px 12px;
  background:var(--accent-soft); color:var(--accent-ink); border-radius:var(--r-sm);
  font-size:13.5px; font-weight:500;
}
#app .saved .bar{flex:1 1 auto; height:2px; background:rgba(127,127,127,.25); border-radius:2px; overflow:hidden}
#app .saved .bar i{display:block; height:100%; background:currentColor; width:100%;
  transform-origin:left; animation:shrink 3s linear forwards}
#app[dir="rtl"] .saved .bar i{transform-origin:right}
@keyframes shrink{to{transform:scaleX(0)}}
#app .flags{display:flex; flex-wrap:wrap; gap:7px; margin-top:4px}

/* segmented scale */
#app .seg{display:flex; gap:6px; margin:6px 0}
#app .seg button{
  flex:1 1 0; min-height:44px; border:1px solid var(--border); border-radius:var(--r-sm);
  background:var(--surface); font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums;
}
#app .seg button.on{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
#app[data-app="dark"] .seg button.on, :root[data-theme="dark"] #app .seg button.on{color:#0F1512}
#app .scalerow{margin-bottom:16px}
#app .scalerow .hd{display:flex; align-items:center; gap:8px; font-size:14px; font-weight:500}
#app .scalerow .hd .e{font-size:17px}
#app .scalerow .hd .sp{flex:1 1 auto}

/* meal composer */
#app .mfield{
  border:1px solid var(--border); border-radius:var(--r-sm); background:var(--surface);
  padding:12px 13px; display:flex; gap:10px; align-items:flex-start; min-height:74px;
}
#app .mfield textarea{
  flex:1 1 auto; border:none; background:none; resize:none; font:inherit; font-size:16px;
  color:var(--text); outline:none; min-height:48px; line-height:1.45; padding:0; width:100%;
}
#app .mfield textarea::placeholder{color:var(--faint)}
#app .mic{flex:0 0 auto; width:34px; height:34px; border-radius:50%; background:var(--sunken);
  display:flex; align-items:center; justify-content:center; color:var(--muted)}
#app .mrow{display:flex; gap:7px; margin:10px 0 4px; flex-wrap:wrap}
#app .parsed{border-top:1px solid var(--border); margin-top:14px; padding-top:12px}
#app .phead{display:flex; align-items:center; gap:8px; font-size:11px; font-weight:600;
  letter-spacing:.11em; text-transform:uppercase; color:var(--faint); margin-bottom:8px}
#app .pi{
  display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border);
  opacity:0; transform:translateY(6px); animation:rise .28s ease forwards;
}
@keyframes rise{to{opacity:1; transform:none}}
#app .pi .e{font-size:19px; flex:0 0 24px; text-align:center}
#app .pi .nm{flex:1 1 auto; font-size:15px; min-width:0}
#app .pi .nm.low{text-decoration:underline dotted var(--warn); text-underline-offset:4px}
#app .pi .qt{font-size:13.5px; color:var(--muted); font-variant-numeric:tabular-nums;
  border:1px solid var(--border); border-radius:6px; padding:4px 8px; white-space:nowrap}
#app .pi .rm{color:var(--faint); font-size:15px; padding:0 3px}
#app .qmark{color:var(--warn); font-size:12px; font-weight:600; margin-inline-start:5px}
#app .spin{display:inline-block; width:11px; height:11px; border:1.5px solid var(--border);
  border-top-color:var(--accent); border-radius:50%; animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* insights */
#app .meta{background:var(--sunken); border-radius:var(--r-sm); padding:11px 13px;
  font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:8px; margin-bottom:6px}
#app .conf{display:inline-flex; align-items:center; gap:6px; font-size:10.5px; font-weight:700;
  letter-spacing:.09em; text-transform:uppercase}
#app .dots{display:inline-flex; gap:2.5px}
#app .dots i{width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.22; display:block}
#app .dots i.f{opacity:1}
#app .c-med{color:var(--accent)} #app .c-low{color:var(--warn)} #app .c-high{color:var(--accent)}
#app .c-done{color:var(--info)}
#app .icard .h{display:flex; align-items:flex-start; gap:8px; margin-bottom:7px}
#app .icard .nm{font-size:16.5px; font-weight:600; letter-spacing:-.015em; flex:1 1 auto; line-height:1.25}
#app .icard .cl{font-size:13.5px; color:var(--muted); line-height:1.45; margin:0 0 10px}
#app .cmp{margin:11px 0 12px}
#app .cmp .lin{display:flex; align-items:center; gap:9px; margin-bottom:7px; font-size:12px}
#app .cmp .k{flex:0 0 84px; color:var(--muted)}

function bars(){
  var v=[3,6,14,31,26,12,8], m=Math.max.apply(null,v);
  return '<svg viewBox="0 0 100 40" preserveAspectRatio="none" style="width:100%;height:52px;display:block">'+
    v.map(function(y,i){
      var h=Math.max(1.5, y/m*36), good=(i>=2&&i<=4);
      return '<rect x="'+(i*14.3+2)+'" y="'+(36-h)+'" width="10.3" height="'+h+'" rx="1.2" fill="'+
      (good?'var(--accent)':'var(--border)')+'"/>'+
      '<text x="'+(i*14.3+7.1)+'" y="39.6" font-size="3.4" fill="var(--faint)" text-anchor="middle">'+(i+1)+'</text>';
    }).join('')+'</svg>';
}
function heat(){
  var o='<svg viewBox="0 0 100 30" style="width:100%;height:40px;display:block">', k=0;
  for(var r=0;r<4;r++) for(var c=0;c<20;c++){
    var lv=(k*37)%100, col = lv>70?'var(--accent)':lv>40?'var(--accent-soft)':'var(--border)';
    o+='<rect x="'+(c*5)+'" y="'+(r*7.5)+'" width="4" height="6" rx="1" fill="'+col+'"/>'; k++;
  }
  return o+'</svg>';
}
function line(v,band){
  var mn=Math.min.apply(null,v), mx=Math.max.apply(null,v), rg=(mx-mn)||1, w=100/(v.length-1);
  var pts=v.map(function(y,i){return (i*w).toFixed(1)+','+(34-(y-mn)/rg*28).toFixed(1);}).join(' ');
  return '<svg viewBox="0 0 100 38" preserveAspectRatio="none" style="width:100%;height:52px;display:block">'+
    (band?'<rect x="30" y="0" width="34" height="38" fill="var(--accent-soft)"/>':'')+
    '<polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" '+
    'stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>';
}

}

  var L=t(), est = sl[3] === '~';
  return '<div class="card" style="margin-bottom:10px">'+
    '<div class="row" style="margin-bottom:8px">'+
      '<span style="font-size:17px">'+sl[0]+'</span>'+
      '<b style="font-size:14.5px;letter-spacing:-.01em">'+esc(sl[1])+'</b>'+
      '<span class="sp"></span>'+
      '<span class="chip" style="font-size:12px'+(est?';border-style:dashed':'')+'">'+
        esc(sl[2])+' ▾</span></div>'+
    '<div class="mfield" style="min-height:0;padding:10px 12px;'+
      (sl[4]?'':'border-style:dashed')+'">'+
      (sl[4]
        ? '<span style="flex:1 1 auto;font-size:15px;line-height:1.4">'+esc(sl[4])+'</span>'
        : '<span class="tiny" style="flex:1 1 auto;color:var(--faint);align-self:center">'+
          esc(L.dvNothing)+'</span>')+
    '</div>'+
    (sl[5]?'<div class="tiny" style="color:var(--accent);margin-top:7px">'+esc(sl[5])+'</div>':'')+
  '</div>';
}

function scrDayBuilder(){
  var L=t();
  return '<div class="abar"><button class="back" data-go="back">←</button>'+
    '<h1 style="font-size:17px">'+esc(L.dbTitle)+'</h1></div>'+
  '<div class="scroll pad">'+
    '<p class="tiny muted" style="margin:0 0 14px">'+esc(L.dbSub)+'</p>'+
    L.dbSlots.map(function(sl){ return slotRow(sl, true); }).join('')+
    '<button class="btn ghost sm">'+esc(L.dbAnother)+'</button>'+
    '<p class="tiny muted" style="margin:10px 0 0">'+esc(L.dbTimes)+'</p>'+
    '<p class="tiny muted" style="margin:6px 0 0">'+esc(L.dbPaste)+'</p>'+

    '<div class="lbl">'+esc(L.dbAlso)+'</div>'+
    '<div class="card" style="padding:2px 15px">'+
      '<div class="lrow"><span style="width:19px;flex:0 0 19px;color:var(--muted)">'+I.stool+'</span>'+
        '<span class="nm">09:40 · '+esc(L.bw[3])+'<s>'+esc(L.dbLogged)+'</s></span>'+
        '<span style="color:var(--accent)">✓</span></div>'+
      '<div class="lrow"><span style="width:19px;flex:0 0 19px;color:var(--faint)">'+I.symptom+'</span>'+
        '<span class="nm" style="color:var(--muted)">'+esc(L.symTitle)+'</span>'+
        '<span class="chip">+</span></div>'+
      '<div class="lrow"><span style="width:19px;flex:0 0 19px;color:var(--faint)">'+I.check+'</span>'+
        '<span class="nm" style="color:var(--muted)">'+esc(L.checkinQ)+'</span>'+

    '</div>'+

    '<button class="btn" data-go="back">'+esc(L.dbSave)+' · '+esc(L.dbCount)+'</button>'+

function scrDayView(){
  var L=t();
  var slots = [L.dbSlots[0], L.dbSlots[1],
               [L.dbSlots[2][0], L.dbSlots[2][1], '~19:30', '~', '', '']];
  return '<div class="abar"><button class="back" data-go="back">←</button>'+
    '<h1 style="font-size:17px">'+esc(L.dvTitle)+'</h1>'+
    '<span class="tiny muted">'+esc(L.scoreWord)+' 62</span></div>'+
  '<div class="scroll pad">'+
    slots.map(function(sl){ return slotRow(sl, true); }).join('')+

    '<div class="lbl">'+esc(L.dbAlso)+'</div>'+
    '<div class="card" style="padding:2px 15px">'+
      L.dvRows.map(function(r){
        return '<button class="lrow" style="width:100%;text-align:start" data-go="openActions">'+
        '<span style="font-size:15px;flex:0 0 22px">'+r[0]+'</span>'+
        '<span class="tm" style="flex:0 0 44px;font-size:12.5px;color:var(--faint)">'+esc(r[1])+'</span>'+
        '<span class="nm">'+esc(r[2])+(r[3]?'<s>'+esc(r[3])+'</s>':'')+'</span>'+
        '<span class="more" style="color:var(--faint)">⋯</span></button>';}).join('')+
    '</div>'+
    '<div class="mrow" style="margin-top:10px">'+
      '<span class="chip">💩 +</span><span class="chip">😣 +</span>'+
      '<span class="chip">⚖️ +</span><span class="chip">📝 +</span></div>'+

    '<div class="egress" style="margin-top:16px">'+
      '<b>'+esc(L.dvWeight)+'</b> — '+esc(L.dvWeightWhy)+'</div>'+
    '<p class="tiny muted" style="margin:10px 0 0;text-align:center">'+esc(L.dvAutosave)+'</p>'+

}

/* ─────────────── render ─────────────── */
function tabs(){
  var L=t(), ic=[I.today,I.line,I.bulb,I.dots], k=['today','timeline','insights','more'];
  return '<div class="tabs">'+k.map(function(key,i){
    return '<button class="tab'+(S.tab===key&&!S.sub?' on':'')+'" data-tab="'+key+'">'+
      ic[i]+'<span>'+esc(L.tabs[i])+'</span></button>';}).join('')+'</div>';
}
function render(){
  var main;
  if(S.tab==='onboard') main=scrOnboard();
  else if(S.sub==='days') main=scrDays();
  else if(S.sub==='trends') main=scrTrends();
  else if(S.sub==='foods') main=scrFoods();
  else if(S.sub==='flagwhy') main=scrFlag();
  else if(S.sub==='reminders') main=scrReminders();
  else if(S.sub==='security') main=scrSecurity();
  else if(S.sub==='daybuild') main=scrDayBuilder();
  else if(S.sub==='dayview') main=scrDayView();
  else if(S.sub==='evidence') main=scrEvidence();
  else if(S.sub==='trial') main=scrTrial();
  else if(S.sub==='verdict') main=scrVerdict();
  else if(S.sub==='nullverdict') main=scrNull();
  else if(S.tab==='timeline') main=scrTimeline();
  else if(S.tab==='insights') main=scrInsights();
  else if(S.tab==='more') main=scrMore();
  else if(S.tab==='day1') main=scrToday1();
  else main=scrToday();

  var sheet='';
  if(S.sheet==='meal') sheet=shMeal();
  else if(S.sheet==='stool') sheet=shStool();
  else if(S.sheet==='checkin') sheet=shCheckin();
  else if(S.sheet==='picker') sheet=shPicker();
  else if(S.sheet==='symptom') sheet=shSymptom();
  else if(S.sheet==='weight') sheet=shWeight();
  else if(S.sheet==='med') sheet=shMed();
  else if(S.sheet==='item') sheet=shItem();
  else if(S.sheet==='actions') sheet=shActions();
  else if(S.sheet==='guard') sheet=shGuard();
  else if(S.sheet==='sync') sheet=shSync();
  else if(S.sheet==='export') sheet=shExport();
  else if(S.sheet==='clarify') sheet=shClarify();
  else if(S.sheet==='guess') sheet=shGuess();

  app.setAttribute('dir', t().dir);
  app.setAttribute('data-app', S.theme==='system'?'':S.theme);
  if(S.flag && S.tab==='today' && !S.sub){
    main = main.replace('<div class="scroll">', '<div class="scroll"><div style="padding-top:6px"></div>'+flagBanner());
  }
  var noTabs = S.tab==='onboard';
  app.innerHTML = main + (noTabs?'':tabs()) +
    '<div class="veil'+(S.sheet?' open':'')+'" data-go="close"></div>'+
    '<div class="sheet'+(S.sheet?' open':'')+'">'+sheet+'</div>';
  syncChrome();
}

/* ─────────────── nav ─────────────── */
var ACT = {
  openMeal:function(){ S.sheet='meal'; S.parse=0; },
  openStool:function(){ S.sheet='stool'; S.bristol=null; S.saved=false; },
  openCheckin:function(){ S.sheet='checkin'; },
  close:function(){ S.sheet=null; S.parse=0; S.bristol=null; S.saved=false; },
  parse:function(){ S.parse=1; render(); setTimeout(function(){ S.parse=2; render(); }, 900); },
  evidence:function(){ S.sub='evidence'; },
  trial:function(){ S.sub='trial'; },
  verdict:function(){ S.sub='verdict'; },
  guessPick:function(){},
  guessSure:function(){},
  verdictPeek:function(){ S.sub='verdict'; },
  back:function(){
    if(S.sub==='days'){ S.sub='evidence'; return; }
    if(S.sub==='trends'||S.sub==='foods'||S.sub==='flagwhy'||S.sub==='reminders'||S.sub==='security'||S.sub==='daybuild'||S.sub==='dayview'){ S.sub=null; return; }
    S.sub = S.sub==='verdict'?'trial': S.sub==='trial'?'evidence':null;
    if(S.sub==='evidence'&&S.tab!=='insights') S.tab='insights';
  },
  fold:function(){ S.fold=!S.fold; },
  openPicker:function(){ S.sheet='picker'; },
  openSymptom:function(){ S.sheet='symptom'; },
  openWeight:function(){ S.sheet='weight'; },
  openMed:function(){ S.sheet='med'; },
  openItem:function(){ S.sheet='item'; },
  openActions:function(){ S.sheet='actions'; },
  openGuard:function(){ S.sheet='guard'; },
  openSync:function(){ S.sheet='sync'; },
  openExport:function(){ S.sheet='export'; },
  openClarify:function(){ S.sheet='clarify'; },
  days:function(){ S.sub='days'; },
  trends:function(){ S.tab='insights'; S.sub='trends'; },
  foods:function(){ S.sub='foods'; },
  flagWhy:function(){ S.sub='flagwhy'; },
  clearFlag:function(){ S.flag=false; },
  reminders:function(){ S.sub='reminders'; },
  security:function(){ S.sub='security'; },
  dayBuild:function(){ S.tab='today'; S.sub='daybuild'; },
  dayView:function(){ S.tab='timeline'; S.sub='dayview'; },
  showCard:function(){ S.card=true; },
  hideCard:function(){ S.card=false; },
  closeToVerdict:function(){ S.sheet=null; S.tab='insights'; S.sub='verdict'; },
  finishOnboard:function(){ S.tab='day1'; S.sub=null; }
};
app.addEventListener('click', function(e){
  var tb = e.target.closest('[data-tab]');
  if(tb){ S.tab=tb.getAttribute('data-tab'); S.sub=null; S.sheet=null; render(); return; }
  var bt = e.target.closest('[data-bristol]');
  if(bt){ S.bristol=+bt.getAttribute('data-bristol'); S.saved=true; render(); return; }
  var g = e.target.closest('[data-go]');
  if(!g) return;
  var k = g.getAttribute('data-go');
  if(!k || !ACT[k]) return;
  if(k==='parse'){ ACT.parse(); return; }
  if(k==='guessPick'){ S.guess=g.getAttribute('data-v'); render(); return; }
  if(k==='guessSure'){ S.guessSure=parseInt(g.getAttribute('data-v'),10); render(); return; }
  ACT[k](); render();
});

var CAPS = {
  onboard:'Four goals, not a questionnaire. Choosing one turns on a matching set of trackers — including the confounders, which is what most food apps skip.',
  day1:'Day one is honest: no fake score, no empty chart. It tells you when the analysis will start being worth anything.',
  today:'One tap to anything. The "usual for this time" tiles learn from your own history — by week three most logs are a single tap.',
  picker:'Eleven trackers behind four tiles was the biggest hole in v1.0. This sheet guarantees every tracker is two taps from Today.',
  meal:'Type it however you say it. The parser runs library-first and only falls back to a model, so it stays fast and works offline.',
  clarify:'A meal with no food in it is not data. The app asks once — and the three options come from your OWN logged history at this hour, never from the model. That distinction is what keeps it a memory aid rather than a fabrication.',
  item:'The learning loop. Correcting a parse writes an alias to your library, so the same words resolve instantly next time.',
  stool:'Tap a tile and it is already saved — no confirm button exists. The ✕ is there from the moment it opens, for accidental taps.',
  symptom:'Several symptoms in one pass, each saved separately so the analysis can tell them apart. Fever and fluids are here because the safety rules read them.',
  weight:'Prefilled with your last reading, so the common case is open-and-save. Body metrics expand inline rather than living somewhere else.',
  med:'The class — PPI, NSAID, antibiotic — is what the analysis consumes as a confounder. The app never suggests changing anything.',
  daybuild:'Logging at night is probably the normal case, and v1.3 treated it as an edge case. One screen, one Save, one undo — and the times come from when you actually eat, not from a clock we made up.',
  dayview:'The same screen in edit mode. Fix, fill or delete anything from one place. The day-weight line at the bottom tells you which past days are pulling their weight and what would fix the ones that are not.',
  timeline:'Everything in one chronology, with the day score alongside. Long-press any row for the action sheet.',
  actions:'Edit, duplicate, change time, split, delete. Every destructive action has an undo toast; only the irreversible ones get a dialog.',
  insights:'Note the order: things worth testing, then hints, then what has been ruled out. No causal language anywhere.',
  evidence:'Sample sizes, interval, adjusted confounders, and an explicit "be careful about this".',
  days:'What makes "auditable" true rather than a claim. Every day behind the number, including the ones that were excluded and why.',
  trends:'Six charts. The last one — logging completeness — is the honest answer to "why is my data thin?".',
  trial:'The hypothesis and the threshold are written down before the trial starts. That is what stops the answer moving later.',
  verdict:'A probability, not a verdict dressed as fact — with the limitations stated plainly and permanently attached.',
  guard:'The button was never disabled. Hitting a guardrail explains, and offers the way forward.',

  flagwhy:'Shows exactly which entries fired the rule and why the rule exists. Still no diagnosis, still no probability.',

var current='today';
function goScreen(id){
  var s = SCREENS.filter(function(x){return x[0]===id;})[0];
  if(!s) return;
  S.parse=0; S.bristol=null; S.saved=false; S.flag=false; S.card=false;
  s[3](); current=id; render();
}
function sideNav(){
  var he = S.lang==='he';
  document.getElementById('sidenav').innerHTML =
    '<div class="grp">Screens</div>'+
    SCREENS.map(function(s,i){
      return '<button class="slink'+(s[0]===current?' on':'')+'" data-screen="'+s[0]+'">'+
        '<span class="n">'+(i+1)+'</span><span>'+esc(he?s[2]:s[1])+'</span></button>';
    }).join('');
  document.getElementById('pickerIn').innerHTML =
    SCREENS.map(function(s,i){
      return '<button class="slink'+(s[0]===current?' on':'')+'" data-screen="'+s[0]+'" '+
        'style="padding:12px 12px;font-size:15px">'+
        '<span class="n">'+(i+1)+'</span><span>'+esc(he?s[2]:s[1])+'</span></button>';
    }).join('');
}
function deriveCurrent(){
  if(S.sheet) return S.sheet;
  if(S.sub) return S.sub;
  if(S.tab==='today' && S.flag) return 'flag';
  return S.tab;
}
function syncChrome(){
  var he = S.lang==='he';
  current = deriveCurrent();
  var s = SCREENS.filter(function(x){return x[0]===current;})[0];
  document.getElementById('mName').textContent = s ? (he?s[2]:s[1]) : '';
  document.getElementById('cap').textContent = CAPS[current]||'';
  document.getElementById('tLangV').textContent = T[S.lang].name;
  document.getElementById('tThemeV').textContent =
    S.theme==='system'?(he?'לפי המכשיר':'System'):S.theme==='dark'?(he?'כהה':'Dark'):(he?'בהיר':'Light');
  sideNav();
}
document.addEventListener('click', function(e){
  var sc = e.target.closest('[data-screen]');
  if(sc){ goScreen(sc.getAttribute('data-screen'));
          document.getElementById('picker').classList.remove('open'); return; }
});
function toggleLang(){ S.lang = S.lang==='en'?'he':'en'; render(); }
function toggleTheme(){ S.theme = S.theme==='system'?'light':S.theme==='light'?'dark':'system'; render(); }

document.getElementById('mLang').onclick = toggleLang;
document.getElementById('tTheme').onclick = toggleTheme;
document.getElementById('mTheme').onclick = toggleTheme;
document.getElementById('tReset').onclick = function(){ goScreen('today'); };
document.getElementById('mPick').onclick = function(){
  document.getElementById('picker').classList.toggle('open'); };
document.getElementById('picker').onclick = function(e){
  if(e.target === this) this.classList.remove('open'); };

render();
})();
